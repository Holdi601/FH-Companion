<!--
  Die Downloadseite fuer die App.

  WARUM ES SIE BRAUCHT: die Auswertungsseite verlinkt auf /app, /mitmachen und
  /admin. Der Server bedient diese Wege auch -- er sucht dafuer app_page.html,
  contribute_page.html und admin_page.html NEBEN sich im server/-Ordner.
  Geschrieben wurde keine davon. Wer klickte, bekam "404 -- app_page.html is
  missing", und zwar seit dem ersten Tag.

  ENGLISCH ZUERST. Meine erste Fassung war durchgehend deutsch -- der Nutzer hat
  richtig angemerkt, dass die App englisch ist und die Seite es auch sein muss.
  Die Sprache wird aus `navigator.languages` gewaehlt, Englisch ist die
  Rueckfallebene, und ein Waehler daneben laesst jeden umstellen. Die Wahl bleibt
  in localStorage stehen.

  Die ZAHLEN stehen nicht im HTML, sondern kommen von /api/haptics: eine
  Downloadseite, die eine veraltete Version behauptet, ist schlimmer als eine ohne
  Angabe. Faellt die Abfrage aus, bleibt der Knopf trotzdem benutzbar.
-->
<style>
/* GROSSE SCHIRME. Die Seite ist in CSS-Pixeln fuer ~1080p-1440p gebaut (Spalte
   1240px, Schrift 12-15px). Auf einem 4K-Schirm mit 100 % Skalierung war sie ein
   schmaler Streifen winziger Schrift, auf 8K/16K unlesbar. zoom skaliert Layout,
   Schrift, Tabellen und Diagramme gemeinsam; die Stufen haengen an der Breite des
   Fensters in CSS-Pixeln, also greifen sie nicht, wenn Windows ohnehin skaliert. */
@media (min-width: 2200px) { html { zoom: 1.5; } }
@media (min-width: 3000px) { html { zoom: 2; } }
@media (min-width: 4400px) { html { zoom: 3; } }
@media (min-width: 6000px) { html { zoom: 4; } }
@media (min-width: 9000px) { html { zoom: 6; } }
@media (min-width: 12000px) { html { zoom: 8; } }

:root {
  --ground: #f5f6f8; --surface: #ffffff; --raised: #fafbfc;
  --border: #e3e7ed; --ink: #0f1520; --ink-soft: #3d4759; --muted: #59647a;
  --bar: #0891b2; --link: #0e7490; --on-ink: #ffffff;
  --shadow: 0 1px 2px rgba(15,21,32,.05), 0 10px 26px rgba(15,21,32,.045);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0b1017; --surface: #131a23; --raised: #182029;
    --border: #232e3b; --ink: #e7ecf3; --ink-soft: #c3ccd9; --muted: #93a2b5;
    --bar: #22d3ee; --link: #5eead4; --on-ink: #0b1017;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; line-height: 1.55;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 26px 18px 70px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.label { font-size: 12.5px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
select {
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 8px; font: inherit; font-size: 13px;
}
h1 {
  font-family: "Barlow Condensed", "IBM Plex Sans", sans-serif; font-weight: 700;
  font-size: clamp(30px, 6vw, 46px); margin: 6px 0 10px; letter-spacing: -.01em;
}
h2 {
  font-family: "Barlow Condensed", "IBM Plex Sans", sans-serif; font-weight: 700;
  font-size: 22px; margin: 32px 0 10px;
}
p { margin: 0 0 12px; max-width: 74ch; color: var(--ink-soft); }
a { color: var(--link); }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow); padding: 20px 22px; margin: 18px 0;
}
.get { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.button {
  display: inline-block; background: var(--ink); color: var(--on-ink);
  text-decoration: none; font-weight: 600; font-size: 17px;
  padding: 13px 26px; border-radius: 9px; border: 1px solid var(--ink);
}
.button:hover { background: var(--bar); border-color: var(--bar); }
.facts { font-size: 13.5px; color: var(--muted); }
.facts div { margin: 2px 0; }
.facts b { color: var(--ink-soft); font-weight: 500; }
.sum { word-break: break-all; }
ul { margin: 0 0 12px; padding-left: 20px; color: var(--ink-soft); max-width: 74ch; }
li { margin: 5px 0; }
table.settings { border-collapse: collapse; font-size: 14px; margin-bottom: 12px; }
table.settings td { padding: 3px 18px 3px 0; color: var(--ink-soft); }
table.settings td:first-child { color: var(--muted); }
/* Der Defender-Hinweis. Auffaellig genug, dass er vor dem Schreck gelesen wird,
   aber kein roter Alarm -- es ist ein Fehlalarm, keine Gefahr. */
.warn {
  margin: 30px 0 0; padding: 18px 20px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 4px solid var(--bar); box-shadow: var(--shadow);
}
[dir="rtl"] .warn { border-left: 1px solid var(--border); border-right: 4px solid var(--bar); }
footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
[dir="rtl"] ul { padding-left: 0; padding-right: 20px; }
[dir="rtl"] table.settings td { padding: 3px 0 3px 18px; }
</style>

// ---------------------------------------------------------------------------
// Sprache waehlen: gespeicherte Wahl, sonst die des Browsers, sonst Englisch.
// ---------------------------------------------------------------------------
function pick() {
  try {
    var saved = localStorage.getItem("fgh-lang");
    if (saved && T[saved]) { return saved; }
  } catch (e) { /* privates Fenster: dann eben die Browsersprache */ }
  var list = navigator.languages || [navigator.language || "en"];
  for (var i = 0; i < list.length; i++) {
    var tag = String(list[i] || "").toLowerCase();
    // Chinesisch: nur Vereinfacht liegt vor. Traditionell faellt auf Englisch
    // zurueck, statt eine Schrift zu zeigen, die nicht gemeint war.
    if (tag.indexOf("zh") === 0) {
      return (tag.indexOf("hant") >= 0 || tag.indexOf("tw") >= 0
              || tag.indexOf("hk") >= 0) ? "en" : "zh";
    }
    var base = tag.split("-")[0];
    if (T[base]) { return base; }
  }
  return "en";
}

function apply(code) {
  var t = T[code] || T.en, en = T.en;
  function put(id, key) {
    var el = document.getElementById(id);
    if (el) { el.textContent = t[key] || en[key] || ""; }
  }
  document.documentElement.lang = code;
  document.documentElement.dir = t.rtl ? "rtl" : "ltr";
  put("tagline", "tagline"); put("dl", "dl");
  put("h-setup", "hSetup"); put("setup1", "setup1"); put("setup2", "setup2");
  put("setup3", "setup3");
  put("h-does", "hDoes");
  put("f1", "f1"); put("f2", "f2"); put("f3", "f3"); put("f4", "f4"); put("f5", "f5");
  put("h-upd", "hUpd"); put("upd", "upd");
  put("h-req", "hReq"); put("req", "req");
  put("h-safe", "hSafe"); put("safe", "safe");
  put("back", "back");
  window.__t = t;
  facts();
}

var paket = null;
function facts() {
  var t = window.__t || T.en, en = T.en, ziel = document.getElementById("facts");
  if (!paket) {
    ziel.innerHTML = '<div class="mono">' + esc(t.noinfo || en.noinfo) + "</div>";
    return;
  }
  function esc(v) {
    return String(v === null || v === undefined ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  // Maskiert: die Werte kommen vom Server, und auf einem Weg ohne TLS kann sie
  // unterwegs jemand ersetzen.
  function row(label, value, cls) {
    return '<div><b>' + esc(label) + '</b> <span class="mono ' + esc(cls || "") + '">'
      + esc(value) + "</span></div>";
  }
  var mb = paket.bytes ? (paket.bytes / 1048576).toFixed(1) + " MB" : "";
  var day = (paket.built_at || "").slice(0, 16).replace("T", " ");
  ziel.innerHTML =
    row(t.file || en.file, paket.name || "fh-companion.zip") +
    (mb ? row(t.size || en.size, mb) : "") +
    (day ? row(t.built || en.built, day) : "") +
    (paket.build ? row(t.build || en.build, paket.build) : "") +
    (paket.sha256 ? row(t.sum || en.sum, paket.sha256, "sum") : "");
}

(function () {
  var sel = document.getElementById("lang");
  var codes = Object.keys(T).sort(function (a, b) {
    return T[a].name.localeCompare(T[b].name);
  });
  codes.forEach(function (c) {
    var o = document.createElement("option");
    o.value = c; o.textContent = T[c].name;
    sel.appendChild(o);
  });
  var start = pick();
  sel.value = start;
  apply(start);
  sel.addEventListener("change", function () {
    try { localStorage.setItem("fgh-lang", sel.value); } catch (e) { /* egal */ }
    apply(sel.value);
  });

  fetch("/api/haptics", { cache: "no-store" })
    .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); })
    .then(function (d) { paket = d; facts(); })
    .catch(function () { paket = null; facts(); });
})();
</script>
