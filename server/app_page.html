<!--
  Die Downloadseite fuer die App.

  WARUM ES SIE BRAUCHT: die Auswertungsseite verlinkt auf /app, /mitmachen und
  /admin. Der Server bedient diese Wege auch -- er sucht dafuer app_page.html,
  contribute_page.html und admin_page.html NEBEN sich im server/-Ordner.
  Geschrieben wurde keine davon. Wer klickte, bekam "404 -- app_page.html is
  missing", und zwar seit dem ersten Tag.

  ENGLISCH ZUERST. Meine erste Fassung war durchgehend deutsch -- der Nutzer hat
  richtig angemerkt, dass die App englisch ist und die Seite es auch sein muss.
  Die Sprache wird aus `navigator.languages` gewaehlt, Englisch ist die
  Rueckfallebene, und ein Waehler daneben laesst jeden umstellen. Die Wahl bleibt
  in localStorage stehen.

  Die ZAHLEN stehen nicht im HTML, sondern kommen von /api/haptics: eine
  Downloadseite, die eine veraltete Version behauptet, ist schlimmer als eine ohne
  Angabe. Faellt die Abfrage aus, bleibt der Knopf trotzdem benutzbar.
-->

// ---------------------------------------------------------------------------
// Sprache waehlen: gespeicherte Wahl, sonst die des Browsers, sonst Englisch.
// ---------------------------------------------------------------------------
function pick() {
  try {
    var saved = localStorage.getItem("fgh-lang");
    if (saved && T[saved]) { return saved; }
  } catch (e) { /* privates Fenster: dann eben die Browsersprache */ }
  var list = navigator.languages || [navigator.language || "en"];
  for (var i = 0; i < list.length; i++) {
    var tag = String(list[i] || "").toLowerCase();
    // Chinesisch: nur Vereinfacht liegt vor. Traditionell faellt auf Englisch
    // zurueck, statt eine Schrift zu zeigen, die nicht gemeint war.
    if (tag.indexOf("zh") === 0) {
      return (tag.indexOf("hant") >= 0 || tag.indexOf("tw") >= 0
              || tag.indexOf("hk") >= 0) ? "en" : "zh";
    }
    var base = tag.split("-")[0];
    if (T[base]) { return base; }
  }
  return "en";
}

function apply(code) {
  var t = T[code] || T.en, en = T.en;
  function put(id, key) {
    var el = document.getElementById(id);
    if (el) { el.textContent = t[key] || en[key] || ""; }
  }
  document.documentElement.lang = code;
  document.documentElement.dir = t.rtl ? "rtl" : "ltr";
  put("tagline", "tagline"); put("dl", "dl");
  put("h-setup", "hSetup"); put("setup1", "setup1"); put("setup2", "setup2");
  put("setup3", "setup3");
  put("h-guides", "hGuides"); put("guides", "guides");
  put("g-pc", "gPc"); put("g-xbox", "gXbox"); put("g-pc-text", "gText"); put("g-xbox-text", "gText");
  // Die Textanleitungen liegen im Quelltext (docs/). Ohne oeffentlichen Quelltext
  // (config/local.json "source_url" leer) keine Links -- lieber keiner als ein 404.
  var quelle = "__SOURCE_URL__";
  Array.prototype.forEach.call(document.querySelectorAll("a.g-text"), function (a) {
    if (/^https:\/\//.test(quelle)) {
      a.href = quelle.replace(/\/+$/, "") + "/blob/main/docs/" + a.getAttribute("data-doc");
    } else {
      a.style.display = "none";
    }
  });
  put("h-does", "hDoes");
  put("f1", "f1"); put("f2", "f2"); put("f3", "f3"); put("f4", "f4");
  put("f6", "f6"); put("f7", "f7"); put("f8", "f8"); put("f9", "f9");
  put("h-upd", "hUpd"); put("upd", "upd");
  put("h-req", "hReq"); put("req", "req");
  put("h-safe", "hSafe"); put("safe", "safe");
  put("back", "back");
  window.__t = t;
  facts();
}

var paket = null;
function facts() {
  var t = window.__t || T.en, en = T.en, ziel = document.getElementById("facts");
  if (!paket) {
    ziel.innerHTML = '<div class="mono">' + esc(t.noinfo || en.noinfo) + "</div>";
    return;
  }
  function esc(v) {
    return String(v === null || v === undefined ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  // Maskiert: die Werte kommen vom Server, und auf einem Weg ohne TLS kann sie
  // unterwegs jemand ersetzen.
  function row(label, value, cls) {
    return '<div><b>' + esc(label) + '</b> <span class="mono ' + esc(cls || "") + '">'
      + esc(value) + "</span></div>";
  }
  var mb = paket.bytes ? (paket.bytes / 1048576).toFixed(1) + " MB" : "";
  var day = (paket.built_at || "").slice(0, 16).replace("T", " ");
  ziel.innerHTML =
    row(t.file || en.file, paket.name || "fh-companion.zip") +
    (mb ? row(t.size || en.size, mb) : "") +
    (day ? row(t.built || en.built, day) : "") +
    (paket.build ? row(t.build || en.build, paket.build) : "") +
    (paket.sha256 ? row(t.sum || en.sum, paket.sha256, "sum") : "");
}

(function () {
  var sel = document.getElementById("lang");
  var codes = Object.keys(T).sort(function (a, b) {
    return T[a].name.localeCompare(T[b].name);
  });
  codes.forEach(function (c) {
    var o = document.createElement("option");
    o.value = c; o.textContent = T[c].name;
    sel.appendChild(o);
  });
  var start = pick();
  sel.value = start;
  apply(start);
  sel.addEventListener("change", function () {
    try { localStorage.setItem("fgh-lang", sel.value); } catch (e) { /* egal */ }
    apply(sel.value);
  });

  fetch("/api/haptics", { cache: "no-store" })
    .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); })
    .then(function (d) { paket = d; facts(); })
    .catch(function () { paket = null; facts(); });
})();
</script>
